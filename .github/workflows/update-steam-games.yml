name: Update Steam Games

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy workflow below

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch recently played games
        run: node scripts/fetch-steam-games.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # deploy workflow is started explicitly; otherwise the live site keeps
      # serving old Steam data until the next manual push.
      - name: Commit updated data and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/steam-games.json
          if git diff --cached --quiet; then
            echo "No changes to public/steam-games.json"
          else
            git commit -m "Update Steam games data"
            git push
            gh workflow run deploy.yml --ref main
          fi
